# Config Example for World News Event Map

node:
  role: "collector"  # 'collector' for Pi3, 'api' for Pi4

pi3:
  db_path: "collector.db"
  poll_interval_seconds: 300
  max_retries: 5
  retry_base_delay_seconds: 5

pi4:
  db_path: "worldnews.db"
  api_host: "0.0.0.0"
  api_port: 8080
  api_url: "http://192.168.0.185:8080/api/v1/internal/articles"

feeds:
  - id: 1
    name: "NHK News Top"
    source_country: "JP"
    language: "ja"
    feed_url: "https://www.nhk.or.jp/rss/news/cat0.xml"
    category: "general"
    enabled: true
    interval_seconds: 300
    timeout_seconds: 10

  - id: 2
    name: "BBC News World"
    source_country: "GB"
    language: "en"
    feed_url: "http://feeds.bbci.co.uk/news/world/rss.xml"
    category: "general"
    enabled: true
    interval_seconds: 300
    timeout_seconds: 10
